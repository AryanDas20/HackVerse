name: HackVerse Automatic Hackathon Discovery

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hackverse-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix functions

      - name: Run HackVerse discovery
        env:
          HACKVERSE_STANDALONE: "1"
          HACKVERSE_RSS_FEEDS: "https://hackalendar.com/feed.xml,https://brabble.ai/rss/hackathons.xml,https://brabble.ai/rss/in/delhi-ncr.xml"
          HACKVERSE_YOUTUBE_API_KEY: ${{ secrets.HACKVERSE_YOUTUBE_API_KEY }}
          HACKVERSE_BRABBLE_API_KEY: ${{ secrets.HACKVERSE_BRABBLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node functions/scripts/run-discovery.js
