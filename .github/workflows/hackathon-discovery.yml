name: HackVerse Automatic Hackathon Discovery

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hackverse-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix functions

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/132626670005/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: hackverse-discovery@hackverseneo.iam.gserviceaccount.com
          project_id: hackverseneo

      - name: Run HackVerse discovery
        env:
          HACKVERSE_STANDALONE: "1"
          HACKVERSE_RSS_FEEDS: "https://hackalendar.com/feed.xml,https://brabble.ai/rss/hackathons.xml,https://brabble.ai/rss/in/delhi-ncr.xml"
          HACKVERSE_YOUTUBE_API_KEY: ${{ secrets.HACKVERSE_YOUTUBE_API_KEY }}
        run: node functions/scripts/run-discovery.js
